{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1>Databases</h1>
<div class="container" id="table">
    <div class="row row-gap-3">
        {% for sheet_slug, sheet_info in sheet_info.items() %}
        <div class="col-6 col-md-4">
            <div class="card" style="width: 18rem;">
                <img src="..." class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">{{ sheet_info['original_name'] }}</h5>
                    <p class="card-text">{{ sheet_info['description'] }}</p>
                    <a href="{{ url_for('display_sheet', sheet_slug=sheet_slug) }}" class="btn btn-primary">Search {{
                        sheet_info['original_name'] }}</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
